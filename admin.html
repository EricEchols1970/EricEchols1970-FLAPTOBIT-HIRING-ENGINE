<!DOCTYPE html>
<html lang="en">
<head>
  <title>Agent Positions Admin</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;}
    body {background:#0a0e27; color:#fff; padding:40px;}
    .header {display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;}
    h1 {font-size:32px; background:linear-gradient(90deg,#3b82f6,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
    .owner {color:#94a3b8; font-size:14px;}
    .wallet {background:#111827; padding:24px; border-radius:12px; border:1px solid #1f2937; margin-bottom:40px;}
    .wallet-label {color:#94a3b8; font-size:14px; margin-bottom:8px;}
    .wallet-amount {font-size:48px; font-weight:700; color:#10b981;}
    .orders-table {width:100%; border-collapse:collapse; background:#111827; border-radius:12px; overflow:hidden;}
    .orders-table th {background:#1f2937; padding:16px; text-align:left; color:#94a3b8; font-size:14px; font-weight:600;}
    .orders-table td {padding:16px; border-top:1px solid #1f2937;}
    .status {padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600; background:#1e3a8a; color:#3b82f6;}
    .btn {background:#3b82f6; color:#fff; padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:14px;}
    .btn:hover {background:#2563eb;}
    .btn:disabled {background:#374151; cursor:not-allowed;}
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Agent Positions Admin</h1>
      <div class="owner">Eric Marlon Echols — Founder</div>
    </div>
  </div>

  <div class="wallet">
    <div class="wallet-label">Stripe Balance — Available</div>
    <div class="wallet-amount" id="walletAmount">$0</div>
    <div style="color:#6b7280; font-size:14px; margin-top:8px;" id="orderCount">Loading...</div>
  </div>

  <h2 style="margin-bottom:20px; font-size:24px;">Recent Payments</h2>
  <table class="orders-table">
    <thead><tr><th>Client</th><th>Amount</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="ordersTable"><tr><td colspan="5" style="text-align:center; color:#6b7280;">Loading...</td></tr></tbody>
  </table>

<script>
const API_BASE = 'https://superagent-39a58392.base44.app/functions';

async function loadStripeData() {
  const res = await fetch(`${API_BASE}/stripeData`);
  const data = await res.json();

  document.getElementById('walletAmount').textContent = `$${(data.balance/100).toLocaleString()}`;
  document.getElementById('orderCount').textContent = `${data.payments.length} payments found`;

  document.getElementById('ordersTable').innerHTML = data.payments.map(p => {
    const status = p.metadata?.status || 'New Order';
    const isScreening = status.includes('Screening');
    return `
    <tr>
      <td>${p.receipt_email || p.customer || 'N/A'}</td>
      <td>$${(p.amount/100).toLocaleString()}</td>
      <td>${new Date(p.created*1000).toLocaleDateString()}</td>
      <td><span class="status">${status}</span></td>
      <td>
        <button class="btn" onclick="deliverTop3('${p.id}', event)" ${isScreening ? 'disabled' : ''}>
          ${isScreening ? 'Screening' : 'Deliver Top 3'}
        </button>
      </td>
    </tr>
  `}).join('');
}

async function deliverTop3(paymentId, event) {
  const btn = event.target;
  btn.textContent = 'Starting...';
  btn.disabled = true;
  
  try {
    const res = await fetch(`${API_BASE}/deliverTop3`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ payment_id: paymentId })
    });
    
    if (res.ok) {
      await loadStripeData();
    } else {
      btn.textContent = 'Retry';
      btn.disabled = false;
    }
  } catch (e) {
    btn.textContent = 'Error';
    btn.disabled = false;
  }
}

loadStripeData();
setInterval(loadStripeData, 30000);
</script>
</body>
</html>
